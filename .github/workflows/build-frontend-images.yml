name: Build and Push ShopSphere Frontend Image

on:
  push:
    branches:
      - main 
    paths:
      - 'Application/frontend/**'
    #   - 'Application/backend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Application/frontend/**'
    #   - 'Application/backend/**'

jobs:
  # --- FRONTEND BUILD JOB ------
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    # This checks if the changes actually occurred in the frontend folder
    # outputs:
      # frontend_changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Uses path filter to selectively run steps based on changed files
      - name: Check for Frontend Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'Application/frontend/**'

      - name: Set up Docker Buildx
        # if: steps.filter.outputs.frontend == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # if: steps.filter.outputs.frontend == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend
        # if: steps.filter.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./Application/frontend
          file: ./Application/frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shopsphere-nodev-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/shopsphere-nodev-frontend:${{ github.sha }}