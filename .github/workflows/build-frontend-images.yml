name: Build and Push ShopSphere Backend Images

on:
  push:
    branches:
      - main # Change this to 'master' or your default branch name if different ---
    paths:
      - 'Application/backend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Application/backend/**'

jobs:
  # --- BACKEND BUILD JOB ----
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Backend Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Application/backend/**'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.backend == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.filter.outputs.backend == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        if: steps.filter.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./Application/backend
          file: ./Application/backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shopsphere-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/shopsphere-backend:${{ github.sha }}
