name: Build and Push ShopSphere Frontend

on:
  push:
    branches: [main, develop]
    paths: ['Application/frontend/**']
  pull_request:
    branches: [main, develop]
    paths: ['Application/frontend/**']

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./Application/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Application/frontend/package-lock.json


      - name: Step to Check variables
        run: |
          [ -n "${{ vars.ECR_REGISTRY }}" ] && echo "ECR_REGISTRY set" || echo "ECR_REGISTRY EMPTY"
          [ -n "${{ vars.AWS_ROLE_ARN }}" ] && echo "AWS_ROLE_ARN set" || echo "AWS_ROLE_ARN EMPTY"
          [ -n "${{ vars.AWS_REGION }}" ] && echo "AWS_REGION set" || echo "AWS_REGION EMPTY"


      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint --if-present

      - name: Run Unit Tests
        run: npm test --if-present -- --ci

      - name: Run npm audit (prod deps only, fails on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Trivy FS Scan (source deps)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './Application/frontend'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.ECR_REGISTRY }}/shopsphere-nodejs-ui
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=

      - uses: docker/setup-buildx-action@v4

      - name: Build image (local, unpushed)
        uses: docker/build-push-action@v7
        with:
          context: ./Application/frontend
          file: ./Application/frontend/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Image Scan (built artifact)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Frontend Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: ./Application/frontend
          file: ./Application/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max