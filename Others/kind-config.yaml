kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: enterprise-dev-cluster
networking:
  disableDefaultCNI: true # Disables standard CNI to unlock advanced features like Cilium
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true" # Labels the node so the ingress controller binds cleanly
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker