name: Build and Push ShopSphere Backend

on:
  push:
    branches: [main]
    paths: ['Application/backend/**']
  pull_request:
    branches: [main]
    paths: ['Application/backend/**']

jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Application/backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Backend Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Application/backend/**'

      - name: Setup Node.js 20
        if: steps.filter.outputs.backend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Application/backend/package-lock.json

      - name: Install Dependencies
        if: steps.filter.outputs.backend == 'true'
        run: npm ci

      # 1. LINT
      - name: Run Lint
        if: steps.filter.outputs.backend == 'true'
        run: npm run lint --if-present

      # 2. UNIT TESTS
      - name: Run Unit Tests
        if: steps.filter.outputs.backend == 'true'
        run: npm test --if-present -- --ci

      # 3. SECURITY SCAN (code)
      - name: Run npm audit
        if: steps.filter.outputs.backend == 'true'
        run: npm audit --audit-level=high || true

      - name: Run Trivy FS Scan
        if: steps.filter.outputs.backend == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: './Application/backend'
          severity: 'CRITICAL,HIGH'

      # 4. TAG IMAGE
      - name: Docker Metadata
        if: steps.filter.outputs.backend == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/shopsphere-node-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      # 5. BUILD + 6. PUSH
      - name: Set up Docker Buildx
        if: steps.filter.outputs.backend == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.filter.outputs.backend == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        if: steps.filter.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./Application/backend
          file: ./Application/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max