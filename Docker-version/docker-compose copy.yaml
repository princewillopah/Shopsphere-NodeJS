services:
  # 1. Database Service
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: my_database
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - shopsohere-nodejs-mysql-data:/var/lib/mysql
    networks:
      - shopsohere-nodejs-network


  seed:
    build: ./backend
    command: npm run seed
    environment:
      MONGO_URI: mongodb://admin:admin12345@shopsohere-ecomms-mongo:27017/shopsphereDB?authSource=admin
      JWT_SECRET: your_strong_secret_key_here
      PORT: 5000
      NODE_ENV: production
    depends_on:
      shopsohere-ecomms-mongo:
        condition: service_healthy
    networks:
      - shopsohere-nodejs-network


  # 2. Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopsohere_node_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db # Matches the name of the db service
      DB_USER: app_user
      DB_PASSWORD: app_password
      DB_NAME: my_database
    depends_on:
      - seed
    networks:
      - shopsohere-nodejs-network

  # 3. Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopsohere-nodejs-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - shopsohere-nodejs-network

volumes:
  shopsohere-nodejs-mysql-data:


networks:
  shopsohere-nodejs-network:
    driver: bridge
