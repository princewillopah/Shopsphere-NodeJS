<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopSphere</title>

    <!-- Google Fonts: Inter + Playfair Display -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700;800&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
      body { 
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      .card-hover:hover { 
        transform: translateY(-4px); 
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      }
      .btn-primary { 
        background: #4f46e5;
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-weight: 500;
        transition: all 300ms;
      }
      .btn-outline {
        border: 1px solid white;
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-weight: 500;
        transition: all 300ms;
      }
      .nav-link { transition: color 300ms; }
      .feature-card {
        background: rgb(255 255 255 / 90%);
        border-radius: 0.75rem;
        padding: 1.5rem;
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 10%);
      }

      .text-dark {
        color: #1e293b;
      }
      .text-muted {
        color: #64748b;
      }
      .feature-card h3 { color: #1e293b; }
      .feature-card p { color: #64748b; }
      footer a:not(.btn) { color: #9ca3af; }

 /* Primary Button - Brighter version */
  .btn-primary {
    background: #6366f1;
    color: white;
    padding: 0.75rem 1.5rem;
    border-radius: 0.5rem;
    font-weight: 500;
    transition: all 300ms;
    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 10%);
  }

  /* Outline Button - More visible version */
  .btn-outline {
    border: 2px solid white;
    color: white;
    padding: 0.75rem 1.5rem;
    border-radius: 0.5rem;
    font-weight: 500;
    transition: all 300ms;
    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 10%);
  }

  /* Make outline button text bolder */
  .btn-outline {
    font-weight: 500;
  }

 .feature-card {
    background: rgb(255 255 255 / 90%);
    border-radius: 0.75rem;
    padding: 2rem;
    box-shadow: 0 10px 15px -3px rgb(0 0 0 / 10%);
    transition: box-shadow 300ms;
  }
  

/* Dark feature cards */
  .dark-feature-card {
    background: rgb(17 24 39 / 80%);
    border-radius: 0.75rem;
    padding: 2rem;
    box-shadow: 0 10px 15px -3px rgb(0 0 0 / 10%);
    transition: box-shadow 300ms;
  }
  
  .dark-feature-card h3 {
    color: white;
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 0.75rem;
  }
  
  .dark-feature-card p {
    color: #d1d5db;
  }
  
  .dark-feature-card .icon {
    color: #818cf8;
    font-size: 2.25rem;
    margin-bottom: 1rem;
  }

  /* Hero buttons for dark backgrounds */
  .hero-btn-solid {
    background: rgb(255 255 255 / 20%);
    color: white;
    border: 1px solid rgb(255 255 255 / 50%);
    padding: 0.75rem 1.5rem;
    border-radius: 0.5rem;
    font-weight: 500;
    transition: all 300ms;
    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 10%);
  }
  
  .hero-btn-outline {
    background: transparent;
    color: white;
    border: 2px solid white;
    padding: 0.75rem 1.5rem;
    border-radius: 0.5rem;
    font-weight: 500;
    transition: all 300ms;
    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 10%);
  }

/* If you want even wider cards, adjust the grid columns */
.product-grid {
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
}

/* For larger screens, you might want */
@media (min-width: 1024px) {
  .product-grid {
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
  }
}
/* Add to your styles */
.product-image {
  transition: transform 0.3s ease;
}
.product-card:hover .product-image {
  transform: scale(1.03);
}

    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
