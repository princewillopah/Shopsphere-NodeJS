server {
    listen 8080;

    # Performance: Compress text files to speed up site loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 📊 METRICS ENDPOINT FOR THE EXPORTER SIDECAR
    location /nginx_status {
        stub_status on;
        access_log off;     # Keeps logs clean from constant Prometheus scraping
        allow 127.0.0.1;    # Only allows the sidecar in the same pod to read it
        deny all;           # Blocks external access from the public internet
    }
    # Serve static files (Vite build output)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Performance: Cache Vite compiled assets heavily
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie; 
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Proxy uploads to backend
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
