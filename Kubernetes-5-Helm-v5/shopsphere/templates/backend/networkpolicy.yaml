{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.backend.enabled .Values.backend.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shopsphere.backend.fullname" . }}
  labels:
    {{- include "shopsphere.backend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shopsphere.backend.selectorLabels" . | nindent 6 }}

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "shopsphere.frontend.selectorLabels" . | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.targetPort }}
{{- end }}