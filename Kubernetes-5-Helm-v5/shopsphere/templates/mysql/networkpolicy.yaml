{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.mysql.enabled .Values.mysql.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shopsphere.mysql.fullname" . }}
  labels:
    {{- include "shopsphere.mysql.labels" . | nindent 4 }}

spec:
  podSelector:
    matchLabels:
      {{- include "shopsphere.mysql.selectorLabels" . | nindent 6 }}

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "shopsphere.backend.selectorLabels" . | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "shopsphere.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: migration
        - podSelector:
            matchLabels:
              {{- include "shopsphere.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: seed
      ports:
        - protocol: TCP
          port: {{ .Values.mysql.service.targetPort }}
{{- end }}