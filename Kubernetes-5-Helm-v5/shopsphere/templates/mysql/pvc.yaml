{{- if and .Values.mysql.enabled .Values.mysql.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "shopsphere.mysql.fullname" . }}
  labels:
    {{- include "shopsphere.mysql.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.mysql.persistence.accessModes | nindent 4 }}

  {{- if .Values.mysql.persistence.storageClass }}
  storageClassName: {{ .Values.mysql.persistence.storageClass | quote }}
  {{- end }}

  resources:
    requests:
      storage: {{ .Values.mysql.persistence.size }}
{{- end }}