{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
      app.kubernetes.io/component: mysql
      app.kubernetes.io/instance: {{ .Release.Name }} #shopsphere
      app.kubernetes.io/name: {{ .Release.Name }} #shopsphere
spec:
  type: {{ .Values.mysql.service.type }}

  selector:
    {{- include "shopsphere.mysql.selectorLabels" . | nindent 4 }}

  ports:
    - name: mysql
      port: {{ .Values.mysql.service.port }}
      targetPort: {{ .Values.mysql.service.targetPort }}
    #   protocol: TCP
    # - name: metrics
    #   port: 9104
    #   targetPort: 9104
{{- end }}