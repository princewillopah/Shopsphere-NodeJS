# ============================================================
# kube-prometheus-stack
# ShopSphere Kubernetes Monitoring
# ============================================================

# ------------------------------------------------------------
# PROMETHEUS
# ------------------------------------------------------------
prometheus:
  enabled: true

  # Scrape everything by default, not just chart-labeled resources.
  # Without this, ServiceMonitors outside the release namespace are ignored.
  serviceMonitorSelectorNilUsesHelmValues: false
  podMonitorSelectorNilUsesHelmValues: false
  ruleSelectorNilUsesHelmValues: false

  prometheusSpec:
    # Discover ServiceMonitors/PodMonitors from all namespaces. # THIS IS WHAT MAKES YOUR APP VISIBLE 



   

    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}

    # Retain metrics for 15 days. 
    retention: 15d

    # retentionSize MUST be smaller than PVC - you had 8GB on 10Gi PVC, it will crash
    retentionSize: 2GB

    # Local Kind cluster storage.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard # DELETE if no standard SC
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi

    # Security
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534

    # Scrape interval
    scrapeInterval: 30s
    evaluationInterval: 30s

    # podAntiAffinity: "hard"
    # replicas: 2
    # walCompression: true


# ------------------------------------------------------------
# GRAFANA
# ------------------------------------------------------------
grafana:

  enabled: true

  # Grafana administrator credentials are stored in a Kubernetes
  # Secret rather than directly in this values file.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # Enable persistent storage so data survives Pod restarts
  persistence:
    enabled: true
    storageClassName: standard  ## Change to your cluster's StorageClass (e.g., gp3, local-path) -  DELETE this line if kubectl get sc shows no standard
    type: pvc
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

  # ingress:
  #   enabled: false   # flip true and configure below if you have an ingress controller


  # Prometheus is automatically configured as Grafana's datasource
  # by kube-prometheus-stack.
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      labelValue: "1"
    datasources:
      enabled: false  # <-- DISABLE broken sidecar
      searchNamespace: ALL
      label: grafana_datasource
      labelValue: "1"

  defaultDashboardsEnabled: true # ← make false to stop the chart from auto-creating its own "Prometheus" entry
  additionalDataSources:
    - name: Prometheus
      type: prometheus
      url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
      access: proxy
      isDefault: true
      jsonData:
        timeInterval: 30s
        # to fix "Not supported" and enable Grafana-managed alerting through this datasource:
        manageAlerts: true
        httpMethod: POST

  service:
    type: ClusterIP
    port: 80

  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472


# ------------------------------------------------------------
# ALERTMANAGER
# ------------------------------------------------------------
alertmanager:

  enabled: true

  alertmanagerSpec:

    retention: 120h

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard # DELETE if no standard SC
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

    # replicas: 2




# ------------------------------------------------------------
# NODE EXPORTER
# ------------------------------------------------------------
nodeExporter:
  enabled: true


# ------------------------------------------------------------
# KUBE STATE METRICS
# ------------------------------------------------------------
kubeStateMetrics:
  enabled: true


# ------------------------------------------------------------
# KUBERNETES COMPONENT MONITORING
# ------------------------------------------------------------

kubeApiServer:
  enabled: true

kubeControllerManager:
  enabled: true

kubeScheduler:
  enabled: true

kubeProxy:
  enabled: true

kubelet:
  enabled: true

coreDns:
  enabled: true


# ------------------------------------------------------------
# DEFAULT PROMETHEUS RULES
# ------------------------------------------------------------
defaultRules:

  create: true

  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general.rules: true
    k8s.rules: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubeControllerManager: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: true
    kubeSchedulerRecording: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true


# ------------------------------------------------------------
# PROMETHEUS OPERATOR
# ------------------------------------------------------------
prometheusOperator:

  enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi


# ------------------------------------------------------------
# kube-state-metrics RESOURCES
# ------------------------------------------------------------
kube-state-metrics:

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi


# ------------------------------------------------------------
# NODE EXPORTER RESOURCES
# ------------------------------------------------------------
prometheus-node-exporter:

  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi