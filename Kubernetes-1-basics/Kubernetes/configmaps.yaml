apiVersion: v1
kind: ConfigMap
metadata:
  name: shopsphere-config
  namespace: shopsphere
data:
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: shopsphere
  NODE_ENV: production
  SERVER_PORT: "5000"
  JWT_EXPIRATION_MS: "604800000"
  CORS_ALLOWED_ORIGINS: "*"
  MAX_UPLOAD_MB: "10"
  STORAGE_PROVIDER: s3
  S3_BUCKET: shopsphere-nodejs-images-bucket
  AWS_REGION: us-east-1
  S3_KEY_PREFIX: products/
  S3_PUBLIC_BASE_URL: ""
  PLACEHOLDER_IMAGE_URL: https://placehold.co/600x400?text=No+Image
  SEED_ENABLED: "true"
  SEED_ADMIN_NAME: Admin
  SEED_ADMIN_EMAIL: admin@shopsphere.local
  DB_POOL_MAX: "10"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: shopsphere
data:
  VITE_API_URL: /api
  VITE_PLACEHOLDER_IMAGE: https://placehold.co/600x400?text=No+Image