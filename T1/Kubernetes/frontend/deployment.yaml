apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shopsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: princewillopah/shopsphere-nodejs-ui:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef: { name: frontend-config }
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30  # Increased from 10
          periodSeconds: 15
          timeoutSeconds: 5        # Increased from 1
          failureThreshold: 4
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 20  # Increased from 5
          periodSeconds: 10
          timeoutSeconds: 5        # Increased from 1
          failureThreshold: 4