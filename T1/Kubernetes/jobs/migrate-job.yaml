apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: shopsphere
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300 # auto-delete after 5 min
  template:
    spec:
      restartPolicy: Never
      initContainers:
      - name: wait-for-db
        image: mysql:8.0
        command: ['sh', '-c', 'until mysqladmin ping -h $DB_HOST -P $DB_PORT -u $MYSQL_USER -p$MYSQL_PASSWORD; do echo waiting for db; sleep 2; done']
        env:
        - name: DB_HOST
          valueFrom: { configMapKeyRef: { name: shopsphere-config, key: DB_HOST } }
        - name: DB_PORT
          valueFrom: { configMapKeyRef: { name: shopsphere-config, key: DB_PORT } }
        - name: MYSQL_USER
          valueFrom: { secretKeyRef: { name: shopsphere-secrets, key: MYSQL_USER } }
        - name: MYSQL_PASSWORD
          valueFrom: { secretKeyRef: { name: shopsphere-secrets, key: MYSQL_PASSWORD } }
        resources:
          requests: { cpu: "20m", memory: "32Mi" }
          limits: { cpu: "50m", memory: "64Mi" }
      containers:
      - name: migrate
        image: princewillopah/shopsphere-node-backend:latest
        imagePullPolicy: Always
        command: ["sh", "-c", "npx sequelize-cli db:migrate"]
        env:
        - name: SERVER_PORT
          valueFrom: { configMapKeyRef: { name: shopsphere-config, key: SERVER_PORT } }
        - name: NODE_ENV
          valueFrom: { configMapKeyRef: { name: shopsphere-config, key: NODE_ENV } }
        - name: DB_HOST
          valueFrom: { configMapKeyRef: { name: shopsphere-config, key: DB_HOST } }
        - name: DB_PORT
          valueFrom: { configMapKeyRef: { name: shopsphere-config, key: DB_PORT } }
        - name: DB_NAME
          valueFrom: { secretKeyRef: { name: shopsphere-secrets, key: MYSQL_DATABASE } }
        - name: DB_USER
          valueFrom: { secretKeyRef: { name: shopsphere-secrets, key: MYSQL_USER } }
        - name: DB_PASSWORD
          valueFrom: { secretKeyRef: { name: shopsphere-secrets, key: MYSQL_PASSWORD } }
        - name: DB_POOL_MAX
          valueFrom: { configMapKeyRef: { name: shopsphere-config, key: DB_POOL_MAX } }
        - name: JWT_SECRET
          valueFrom: { secretKeyRef: { name: shopsphere-secrets, key: JWT_SECRET } }
        - name: JWT_EXPIRATION_MS
          valueFrom: { configMapKeyRef: { name: shopsphere-config, key: JWT_EXPIRATION_MS } }
        - name: CORS_ALLOWED_ORIGINS
          valueFrom: { configMapKeyRef: { name: shopsphere-config, key: CORS_ALLOWED_ORIGINS } }
        - name: SEED_ENABLED
          valueFrom: { configMapKeyRef: { name: shopsphere-config, key: SEED_ENABLED } }
        - name: SEED_ADMIN_NAME
          valueFrom: { configMapKeyRef: { name: shopsphere-config, key: SEED_ADMIN_NAME } }
        - name: SEED_ADMIN_EMAIL
          valueFrom: { configMapKeyRef: { name: shopsphere-config, key: SEED_ADMIN_EMAIL } }
        - name: SEED_ADMIN_PASSWORD
          valueFrom: { secretKeyRef: { name: shopsphere-secrets, key: SEED_ADMIN_PASSWORD } }
        - name: MAX_UPLOAD_MB
          valueFrom: { configMapKeyRef: { name: shopsphere-config, key: MAX_UPLOAD_MB } }
        - name: STORAGE_PROVIDER
          valueFrom: { configMapKeyRef: { name: shopsphere-config, key: STORAGE_PROVIDER } }
        - name: S3_BUCKET
          valueFrom: { configMapKeyRef: { name: shopsphere-config, key: S3_BUCKET } }
        - name: AWS_REGION
          valueFrom: { configMapKeyRef: { name: shopsphere-config, key: AWS_REGION } }
        - name: S3_KEY_PREFIX
          valueFrom: { configMapKeyRef: { name: shopsphere-config, key: S3_KEY_PREFIX } }
        - name: AWS_ACCESS_KEY_ID
          valueFrom: { secretKeyRef: { name: shopsphere-s3-secrets, key: AWS_ACCESS_KEY_ID } }
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: { secretKeyRef: { name: shopsphere-s3-secrets, key: AWS_SECRET_ACCESS_KEY } }
        resources:
          requests: { cpu: "100m", memory: "128Mi" }
          limits: { cpu: "300m", memory: "512Mi" }
